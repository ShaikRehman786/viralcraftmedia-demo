# Render Blueprint — ViralCraftMedia backend (WhatsApp/Puppeteer production fix).
#
# WHY THIS EXISTS: whatsapp-web.js@1.34.7 -> puppeteer@24.38.0 downloads
# Chrome 146.x into the Puppeteer cache during the build. The default cache
# dir (/opt/render/.cache/puppeteer) lives OUTSIDE the project directory and
# does not survive the build -> runtime handoff, so production crashed with
# "Could not find Chrome (ver. 146.0.7680.31)". This Blueprint:
#   1. Points PUPPETEER_CACHE_DIR *inside* the project directory (persists
#      from build to runtime), and
#   2. Installs the exact Chrome revision puppeteer expects during the BUILD
#      phase (`npm run setup:chrome`), never at server start or per connection.
#
# If this service was created manually in the Render dashboard (not from this
# Blueprint), apply the same two settings there instead:
#   Build Command: npm ci && npm run setup:chrome
#   Environment variable: PUPPETEER_CACHE_DIR=/opt/render/project/src/backend/.cache/puppeteer
# Local development is unaffected (no PUPPETEER_* vars are set locally, so
# Puppeteer keeps using the existing local user cache).

services:
  - type: web
    name: viralcraftmedia-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run setup:chrome
    startCommand: node server.js
    # Render injects PORT automatically; backend reads process.env.PORT.
    envVars:
      - key: NODE_ENV
        value: production
      # Project-local browser cache: survives build -> runtime (the fix).
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer
      # Secrets below are placeholders only — real values stay in the
      # Render dashboard and are never committed. sync: false means the
      # Blueprint will not overwrite dashboard values.
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BACKUP_JWT_SECRET
        sync: false
      - key: PARTNER_JWT_SECRET
        sync: false
      - key: BACKUP_ADMIN_EMAIL
        sync: false
      - key: BACKUP_ADMIN_PASSWORD
        sync: false
